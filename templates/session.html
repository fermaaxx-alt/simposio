{% extends "base.html" %}{% block content %}<a href="{{ url_for('teacher') }}">← Volver a mis clases</a><h1>Asistencia: {{ s.name }}</h1><section class="sessiongrid"><div class="panel center"><h2>Escanea para marcar</h2><img id="qr" class="qr" src="{{ url_for('qr_image',session_id=s.id) }}" alt="Código QR de asistencia"><p class="muted">El QR se renueva cada {{ refresh }} segundos.</p><p class="warning">Muestra este QR únicamente en el aula.</p></div><div class="panel"><h2>Registros</h2><p class="big"><strong id="count">{{ count }}</strong> / <span id="enrolled">{{ enrolled }}</span></p><p>Estudiantes presentes</p><div id="attendees" class="attendees"></div><form method="post" action="{{ url_for('end_session',session_id=s.id) }}" onsubmit="return confirm('¿Cerrar la asistencia?');"><button class="danger">Cerrar asistencia</button></form></div></section>
<script>
const qr=document.getElementById('qr'), attendees=document.getElementById('attendees');
setInterval(()=>{qr.src="{{ url_for('qr_image',session_id=s.id) }}?t="+Date.now();}, {{ refresh*1000 }});
async function update(){try{const r=await fetch("{{ url_for('session_status',session_id=s.id) }}");const d=await r.json();document.getElementById('count').textContent=d.count;document.getElementById('enrolled').textContent=d.enrolled;attendees.innerHTML=d.attendance.map(x=>`<div class="listrow"><strong>${escapeHtml(x.full_name)}</strong><span>${escapeHtml(x.section_name||"Sin sección")} · ${new Date(x.marked_at).toLocaleTimeString()}</span></div>`).join('')||'<p class="muted">Aún no hay registros.</p>';if(!d.active){location.reload();}}catch(e){}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
update();setInterval(update,4000);
</script>{% endblock %}
